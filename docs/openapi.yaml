openapi: 3.0.3
info:
  title: PHONETIX Institutional English Phonetics LMS API
  version: 1.0.0
  description: |
    Production-grade RESTful API for the PHONETIX Educational Platform.
    Provides authentication, multi-tenant academic management, phoneme-level pronunciation assessment,
    AI conversational speech tutor, educational game scoring, and teacher grading workflows.
  contact:
    name: PHONETIX Engineering Directorate
    email: api-support@phonetix-institution.edu
servers:
  - url: /api/v1
    description: Current Environment API V1 Gateway
paths:
  /auth/register:
    post:
      summary: Student registration (creates pending account)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistrationRequest'
      responses:
        '201':
          description: Registration submitted, pending admin review.
        '422':
          description: Validation error or duplicate student ID.

  /auth/login:
    post:
      summary: Authenticate user session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '403':
          description: Account pending review, suspended, or rejected.

  /auth/me:
    get:
      summary: Get currently authenticated user profile
      security:
        - BearerAuth: []
      tags: [Authentication]
      responses:
        '200':
          description: Current user context with role and permissions.

  /admin/approvals:
    get:
      summary: List pending student registrations
      security:
        - BearerAuth: []
      tags: [Administration]
      responses:
        '200':
          description: List of pending registrations awaiting review.
    post:
      summary: Batch approve or reject registrations
      security:
        - BearerAuth: []
      tags: [Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  items:
                    type: integer
                action:
                  type: string
                  enum: [approve, reject]
                rejection_reason:
                  type: string

  /admin/telemetry:
    get:
      summary: Get real-time backend health, queue status, and system metrics
      security:
        - BearerAuth: []
      tags: [Administration]
      responses:
        '200':
          description: Health telemetry data.

  /ipa/chart:
    get:
      summary: Retrieve standard English IPA inventory with vowel/consonant classifications
      tags: [IPA Laboratory]
      responses:
        '200':
          description: Structured IPA chart dataset with audio mapping and articulation metadata.

  /pronunciation/exercises:
    get:
      summary: List pronunciation exercises with phonetic targets
      security:
        - BearerAuth: []
      tags: [Pronunciation Assessment]
      parameters:
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
      responses:
        '200':
          description: Paginated exercise list.

  /pronunciation/assess:
    post:
      summary: Submit audio recording for phoneme-level AI assessment
      security:
        - BearerAuth: []
      tags: [Pronunciation Assessment]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [exercise_id, audio_file]
              properties:
                exercise_id:
                  type: integer
                audio_file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Detailed phoneme-by-phoneme score breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PronunciationAssessmentResponse'

  /ai/conversations:
    post:
      summary: Start a new pedagogical English conversation session
      security:
        - BearerAuth: []
      tags: [AI Speaking Partner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic:
                  type: string
                cefr_level:
                  type: string
                  enum: [A1, A2, B1, B2, C1]
      responses:
        '201':
          description: Conversation session created.

  /games:
    get:
      summary: List available phonetics educational games
      security:
        - BearerAuth: []
      tags: [Educational Games]
      responses:
        '200':
          description: List of games categorized by pedagogical mechanic.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StudentRegistrationRequest:
      type: object
      required:
        - first_name
        - last_name
        - student_id
        - email
        - academic_year
        - department
        - group_name
        - password
        - password_confirmation
        - accepted_terms
      properties:
        first_name:
          type: string
        last_name:
          type: string
        student_id:
          type: string
        email:
          type: string
          format: email
        personal_email:
          type: string
          format: email
        phone:
          type: string
        academic_year:
          type: string
        department:
          type: string
        group_name:
          type: string
        password:
          type: string
          format: password
        password_confirmation:
          type: string
        accepted_terms:
          type: boolean

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthSuccessResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
            role:
              type: string
              enum: [super_admin, teacher, student]
            status:
              type: string

    PronunciationAssessmentResponse:
      type: object
      properties:
        overall_score:
          type: number
        accuracy_score:
          type: number
        fluency_score:
          type: number
        completeness_score:
          type: number
        prosody_score:
          type: number
        phonemes:
          type: array
          items:
            type: object
            properties:
              phoneme:
                type: string
              ipa_symbol:
                type: string
              score:
                type: number
              status:
                type: string
                enum: [correct, acceptable, needs_improvement, omitted]
              suggestion:
                type: string
        actionable_feedback:
          type: string
